<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 배율은 js/stage.js 가 맡는다. viewport-fit=cover 는 노치 있는 폰에서 가로로 들었을 때 양옆을 채우려고 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16151c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>볼더슬</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/journey.css">
<link rel="stylesheet" href="css/dex.css">
<link rel="stylesheet" href="css/team.css">
<link rel="stylesheet" href="css/battle.css">
<link rel="stylesheet" href="css/stage.css">
</head>
<body>
<header class="top">
  <h1>볼더슬 <span class="ver">프로토타입</span></h1>
  <p class="unofficial">트릭컬 리바이브 팬 게임 · 비공식 개인 제작. 공식과 무관합니다.</p>
  <button id="fullscreen" class="fsbtn" type="button" title="전체화면">⛶ <span>전체화면</span></button>
</header>

<!-- 휴대폰을 세로로 들었을 때만 보인다 — 이 게임은 가로로 한다 -->
<div class="rotate" aria-live="polite">
  <div class="rotate-phone"></div>
  <p>휴대폰을 <b>가로로</b> 돌려 주세요</p>
  <small>볼더슬은 가로 화면에서 합니다</small>
</div>

<main id="screen"></main>

<footer class="bottom">
  <span id="hint"></span>
</footer>

<!-- 스파인 런타임 — 있으면 전투 SD·스탠딩·미니미가 움직인다. 없으면 그림 한 장으로 떨어진다.
     Spine Runtimes 는 쓰는 사람이 각자 Spine Editor 라이선스를 가져야 한다(vendor/spine-webgl.LICENSE). -->
<script src="vendor/spine-webgl.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
